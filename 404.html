<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src *; img-src * data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; font-src *; connect-src *; frame-src *;">
    <title>Перенаправление...</title>
    <script>
      // Перенаправление для HashRouter
      var path = window.location.pathname;
      if (path === '/' || path === '/index.html') {
        window.location.replace('/#/');
      } else {
        // Убираем первый / и перенаправляем на хэш-роут
        var hashPath = path.replace(/^\//, '');
        window.location.replace('/#' + hashPath + window.location.search + window.location.hash);
      }
    </script>
  </head>
  <body>
    <p>Перенаправление...</p>
    <script>setTimeout(function(){ window.location.replace('/#/'); }, 1000);</script>
  </body>
</html>
